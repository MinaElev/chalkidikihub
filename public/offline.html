<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Halkidiki Hub - Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #f9fafb; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .container { text-align: center; max-width: 400px; }
    .icon { width: 80px; height: 80px; background: #0284c7; border-radius: 20px; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; }
    .icon span { color: white; font-size: 40px; font-weight: bold; }
    h1 { font-size: 24px; color: #111827; margin-bottom: 8px; }
    p { color: #6b7280; font-size: 16px; line-height: 1.5; margin-bottom: 24px; }
    button { background: #0284c7; color: white; border: none; padding: 12px 32px; border-radius: 12px; font-size: 16px; font-weight: 500; cursor: pointer; }
    button:hover { background: #0369a1; }
    .lang { font-size: 13px; color: #9ca3af; margin-top: 16px; line-height: 1.8; }
  </style>
  <script>
    // Auto-detect language from URL or browser
    const msgs = {
      el: { t: 'Χωρίς σύνδεση', p: 'Δεν υπάρχει σύνδεση στο internet. Ελέγξτε τη σύνδεσή σας και δοκιμάστε ξανά.', b: 'Δοκιμάστε ξανά' },
      en: { t: 'You are offline', p: 'No internet connection. Please check your connection and try again.', b: 'Try again' },
      de: { t: 'Offline', p: 'Keine Internetverbindung. Bitte überprüfen Sie Ihre Verbindung und versuchen Sie es erneut.', b: 'Erneut versuchen' },
      bg: { t: 'Офлайн', p: 'Няма интернет връзка. Проверете връзката си и опитайте отново.', b: 'Опитай отново' },
      ru: { t: 'Нет сети', p: 'Нет подключения к интернету. Проверьте соединение и попробуйте снова.', b: 'Попробовать снова' },
      ro: { t: 'Offline', p: 'Nu există conexiune la internet. Verificați conexiunea și încercați din nou.', b: 'Încercați din nou' },
      sr: { t: 'Nema mreže', p: 'Nema internet konekcije. Proverite vezu i pokušajte ponovo.', b: 'Pokušaj ponovo' },
    };
    function init() {
      const path = window.location.pathname;
      const urlLang = path.split('/')[1];
      const lang = msgs[urlLang] ? urlLang : (navigator.language?.slice(0, 2) || 'en');
      const m = msgs[lang] || msgs.en;
      document.getElementById('title').textContent = m.t;
      document.getElementById('desc').textContent = m.p;
      document.getElementById('btn').textContent = m.b;
      document.documentElement.lang = lang;
    }
    document.addEventListener('DOMContentLoaded', init);
  </script>
</head>
<body>
  <div class="container">
    <div class="icon"><span>H</span></div>
    <h1 id="title">You are offline</h1>
    <p id="desc">No internet connection. Please check your connection and try again.</p>
    <button id="btn" onclick="window.location.reload()">Try again</button>
    <div class="lang">
      🇬🇷 🇬🇧 🇩🇪 🇧🇬 🇷🇺 🇷🇴 🇷🇸
    </div>
  </div>
</body>
</html>
