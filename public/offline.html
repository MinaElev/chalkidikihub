<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Halkidiki Hub - Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #f9fafb; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .container { text-align: center; max-width: 400px; }
    .icon { width: 80px; height: 80px; background: #0284c7; border-radius: 20px; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; }
    .icon span { color: white; font-size: 40px; font-weight: bold; }
    h1 { font-size: 24px; color: #111827; margin-bottom: 8px; }
    p { color: #6b7280; font-size: 16px; line-height: 1.5; margin-bottom: 24px; }
    button { background: #0284c7; color: white; border: none; padding: 12px 32px; border-radius: 12px; font-size: 16px; font-weight: 500; cursor: pointer; }
    button:hover { background: #0369a1; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon"><span>H</span></div>
    <h1>Χωρίς σύνδεση</h1>
    <p>Δεν υπάρχει σύνδεση στο internet. Ελέγξτε τη σύνδεσή σας και δοκιμάστε ξανά.</p>
    <button onclick="window.location.reload()">Δοκιμάστε ξανά</button>
  </div>
</body>
</html>
